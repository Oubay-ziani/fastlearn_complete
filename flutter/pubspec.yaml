name: fastlearn
description: Fast Learn - E-Learning Platform
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.3.0

  # Video
  video_player: ^2.9.1
  chewie: ^1.8.5

  # PDF
  flutter_pdfview: ^1.3.2

  # HTTP — single version satisfying all packages
  http: ^1.2.2

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.69.0

  # File picker
  file_picker: ^8.1.2

  # Payment
  flutter_stripe: ^10.2.0

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  connectivity_plus: ^6.1.0
  package_info_plus: ^8.1.0
  pdf: ^3.11.1
  printing: ^5.13.2
  path: ^1.9.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
    - assets/animations/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800